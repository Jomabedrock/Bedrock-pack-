<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bedrock Packs | Minecraft Bedrock</title>
<meta name="theme-color" content="#10091f">
<style>
:root {
  --bg:#0b0714;
  --panel:#171025;
  --panel2:#211532;
  --purple:#a855f7;
  --pink:#ec4899;
  --text:#f8f5ff;
  --muted:#b9adc9;
  --border:#332344;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%,#32134d 0,transparent 45%),
    var(--bg);
  color:var(--text);
}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
header{
  position:sticky;top:0;z-index:10;
  background:#0b0714eF;
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.nav{
  max-width:1200px;margin:auto;padding:15px 22px;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
}
.logo{font-size:21px;font-weight:900;letter-spacing:-.5px}
.logo span{color:var(--purple)}
.navlinks{display:flex;gap:20px;flex-wrap:wrap}
.navlinks a{color:var(--muted);font-size:14px}
.navlinks a:hover{color:white}
.btn{
  border:0;border-radius:12px;padding:12px 17px;
  color:white;font-weight:800;
  background:linear-gradient(120deg,var(--purple),var(--pink));
  box-shadow:0 0 22px #a855f733;
}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
main{max-width:1200px;margin:auto;padding:0 22px}
.hero{
  padding:75px 0 50px;
  display:grid;grid-template-columns:1.25fr .75fr;
  align-items:center;gap:35px;
}
.tag{
  display:inline-block;padding:8px
